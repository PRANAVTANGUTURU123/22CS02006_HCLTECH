[project]
name = "cold-chain-alerting"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=backend --cov-report=term-missing:skip-covered"


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S324", "E501"]
